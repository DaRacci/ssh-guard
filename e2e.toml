roots = []
units = []

[global]
audit_log = "/tmp/ssh-guard-e2e.log"
audit_format = "logfmt"
help_text = ""
log_tag = "ssh-guard-e2e"
max_read_bytes = 1048576
max_tail_lines = 5000
default_tail_lines = 200

[contracts.unit]
type = "enum"
values = ["ssh", "nginx"]

[flag_groups]
pager = ["--no-pager", "-q"]

# head-like rule: value flag (-n), standalone flags (-q/-v), positional path
[[rules]]
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-n", "-q", "-v"]
args = ["{string}"]

[rules.action]
type = "run"
binary = "/opt/test/bin/head"
args = []
timeout = "5000ms"

# df-like rule: mixed flags + positional args on one rule (the t_82ada652 case)
[[rules]]
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-h", "-i"]
args = ["{string}"]

[rules.action]
type = "run"
binary = "/opt/test/bin/df"
args = []
timeout = "5000ms"
