[package]
name = "ssh-guard"
description = "Guard your SSH server with dynamic scoped rules, and audit logging."
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://codeberg.org/Racci/ssh-guard"
include = ["src/**", "tests/**", "supply-chain/**", "LICENSE"]
categories = ["security", "network-programming", "command-line-utilities", "command-line-utilities", "config"]
keywords = ["ssh", "audit", "guard", "privilege", "server"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.*"
serde_json = "1"
thiserror = "2"
shlex = "~2.0.1"
log = "0.4"
syslog = "~7"
nix = { version = "0.31.3", default-features = false, features = [
  "fs",
  "signal",
  "process",
] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
divan = "0.1"

[[bench]]
name = "regressions"
harness = false

[profile.coverage]
inherits = "dev"
debug = true

[profile.release]
panic = "abort"
lto = true
strip = true
