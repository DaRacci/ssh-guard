roots = [
  "/var/log",
  "/etc",
  "/proc",
  "/sys",
]

[global]
audit_log = "/var/log/ssh-guard-audit.log"
audit_format = "json"
help_text = """
Read-only Proxmox diagnostics allowed:
  systemctl status|is-active|is-enabled|is-failed|list-units|list-timers|
             list-failed|show|cat <unit>
  journalctl -n <lines> [-u <unit>] | --disk-usage | --list-boots
  df [-h] [-i] [<path>]          du -d<0-3> <path>            free -h
  uptime                         vmstat 1 [<count>]           ps aux|ps -ef
  ss [-tulpn|-s]                 ip addr|route|link|neigh     lsblk
  uname -a                       hostname                     lscpu
  dmesg (tail, capped)
  cat / tail / stat / ls on files under /var/log, /etc, /proc, /sys
  pct config <vmid> | pct list   smartctl -a /dev/disk/by-id/<disk>
  zpool status [-s] [<pool>]
"""
log_tag = "ssh-guard"
max_read_bytes = 1048576
max_tail_lines = 5000
default_tail_lines = 200

[contracts.unit_name]
type = "string_len"
min = 1
max = 128

[contracts.du_depth]
type = "int_range"
min = 0
max = 3

[contracts.log_lines]
type = "int_range"
min = 1
max = 500

[contracts.count]
type = "int_range"
min = 1
max = 20

[flag_groups]
systemctl_safe_flags = ["--no-pager", "--full"]

[[rules]]
command = "systemctl"
implicit_symlinks = true
arg_style = "gnu_long"
flag_groups = ["systemctl_safe_flags"]

[rules.action]
type = "run"
binary = "/usr/bin/systemctl"
args = []
timeout = "10000ms"

[[rules.subcommands]]
name = "status"
flags = ["-l", "--all"]
args = ["{unit_name}"]

[[rules.subcommands]]
name = "is-active"
args = ["{unit_name}"]

[[rules.subcommands]]
name = "is-enabled"
args = ["{unit_name}"]

[[rules.subcommands]]
name = "is-failed"
args = ["{unit_name}"]

[[rules.subcommands]]
name = "show"
flags = ["--all", "--no-pager"]
args = ["{unit_name}"]

[[rules.subcommands]]
name = "cat"
flags = ["--no-pager"]
args = ["{unit_name}"]

[[rules.subcommands]]
name = "list-units"
flags = [
  "--all",
  "--failed",
  "--type={string}",
  "--state={string}",
  "--no-pager",
  "--no-legend",
  "-l",
]

[[rules.subcommands]]
name = "list-timers"
flags = ["--all", "--no-pager"]

[[rules.subcommands]]
name = "list-failed"
flags = ["--no-pager", "--no-legend"]

[[rules.subcommands]]
name = "list-sockets"
flags = ["--no-pager", "--no-legend"]

[[rules.subcommands]]
name = "list-dependencies"
flags = ["--all", "--no-pager"]
args = ["{unit_name}"]

[[rules.subcommands]]
name = "daemon-status"

[[rules]]
command = "journalctl"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["--no-pager", "-q", "--utc"]

[rules.action]
type = "run"
binary = "/usr/bin/journalctl"
args = []
timeout = "10000ms"

[[rules.subcommands]]
name = "-n"
flags = [
  "-u={string}",
  "--unit={string}",
  "-p={string}",
  "--priority={string}",
  "--since={string}",
  "--until={string}",
  "-o={string}",
  "--output={string}",
  "--no-pager",
  "-q",
]
args = ["{log_lines}"]

[[rules.subcommands]]
name = "-u"
flags = [
  "-n={log_lines}",
  "--lines={log_lines}",
  "-p={string}",
  "--priority={string}",
  "--since={string}",
  "--until={string}",
  "-o={string}",
  "--output={string}",
  "--no-pager",
  "-q",
  "-b",
  "--boot={string}",
]
args = ["{unit_name}"]

[[rules.subcommands]]
name = "--disk-usage"

[[rules.subcommands]]
name = "--list-boots"
flags = ["--no-pager", "-q"]

[[rules.subcommands]]
name = "-b"
flags = [
  "-u={string}",
  "--unit={string}",
  "-n={log_lines}",
  "--lines={log_lines}",
  "-p={string}",
  "--no-pager",
  "-q",
]
args = ["{int}"]

[[rules.subcommands]]
name = "-p"
flags = [
  "-n={log_lines}",
  "--lines={log_lines}",
  "-u={string}",
  "--unit={string}",
  "--since={string}",
  "--no-pager",
  "-q",
]
args = ["{string}"]

[[rules]]
command = "df"
implicit_symlinks = true
arg_style = "gnu_long"
flags = [
  "-h",
  "--human-readable",
  "-i",
  "--inodes",
  "-T",
  "--output={string}",
  "-x={string}",
  "--exclude-type={string}",
  "--total",
]
args = ["{string}"]

[rules.action]
type = "run"
binary = "/usr/bin/df"
args = []
timeout = "10000ms"

[[rules]]
command = "du"
implicit_symlinks = true
arg_style = "gnu_long"
flags = [
  "-h",
  "--human-readable",
  "-s",
  "--summarize",
  "-x",
  "--one-file-system",
  "-d={du_depth}",
  "--max-depth={du_depth}",
]
args = ["{path:string}"]

[rules.action]
type = "run"
binary = "/usr/bin/du"
args = []
timeout = "30000ms"

[[rules]]
command = "lsblk"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-f", "-o={string}", "--output={string}", "-a", "--all", "-J", "--json", "--noheadings"]

[rules.action]
type = "run"
binary = "/usr/bin/lsblk"
args = []
timeout = "10000ms"

[[rules]]
command = "free"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-h", "--human-readable", "-m", "-g", "-s={count}", "-w", "--wide"]

[rules.action]
type = "run"
binary = "/usr/bin/free"
args = []
timeout = "5000ms"

[[rules]]
command = "uptime"
implicit_symlinks = true
arg_style = "gnu_long"

[rules.action]
type = "run"
binary = "/usr/bin/uptime"
args = []
timeout = "5000ms"

[[rules]]
command = "vmstat"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-a", "--active", "-s", "--stats", "-d", "--disk", "-t", "--timestamp"]
args = ["{count}"]

[rules.action]
type = "run"
binary = "/usr/bin/vmstat"
args = ["1"]
timeout = "15000ms"

[[rules]]
command = "lscpu"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-e={string}", "--extended={string}", "-p={string}", "--parse={string}", "-J", "--json"]

[rules.action]
type = "run"
binary = "/usr/bin/lscpu"
args = []
timeout = "5000ms"

[[rules]]
command = "uname"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-a", "--all", "-r", "--kernel-release", "-v", "--kernel-version"]

[rules.action]
type = "run"
binary = "/usr/bin/uname"
args = ["-a"]
timeout = "5000ms"

[[rules]]
command = "hostname"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-f", "--fqdn", "-i", "--ip-address", "-s", "--short"]

[rules.action]
type = "run"
binary = "/usr/bin/hostname"
args = []
timeout = "5000ms"

[[rules]]
command = "dmesg"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-T", "--time-format=iso", "-l={string}", "--level={string}", "-n={log_lines}", "--tail={log_lines}", "--since={string}", "--human"]

[rules.action]
type = "run"
binary = "/usr/bin/dmesg"
args = []
timeout = "10000ms"

[[rules]]
command = "ps"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["aux", "-ef", "-e", "-f", "-u={string}", "--sort={string}", "-o={string}", "--no-headers", "-p={string}", "-C={string}", "-H", "--forest", "-w", "-ww"]

[rules.action]
type = "run"
binary = "/usr/bin/ps"
args = []
timeout = "10000ms"

[[rules]]
command = "ss"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-t", "-u", "-l", "-p", "-n", "-a", "-s", "-i", "-e", "-m", "-o", "-4", "-6"]

[rules.action]
type = "run"
binary = "/usr/bin/ss"
args = []
timeout = "10000ms"

[[rules]]
command = "ip"
implicit_symlinks = true
arg_style = "gnu_long"

[rules.action]
type = "run"
binary = "/usr/sbin/ip"
args = []
timeout = "10000ms"

[[rules.subcommands]]
name = "addr"
flags = ["show", "list"]

[[rules.subcommands]]
name = "route"
flags = ["show", "list"]
args = ["{string}"]

[[rules.subcommands]]
name = "link"
flags = ["show", "list"]

[[rules.subcommands]]
name = "neigh"
flags = ["show", "list"]

[[rules.subcommands]]
name = "stats"
flags = ["show"]

[[rules]]
command = "cat"
implicit_symlinks = true
arg_style = "gnu_long"
args = ["{path:string}"]

[rules.action]
type = "read_file"
path_capture = "path"
root_set = "roots"

[[rules]]
command = "tail"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-n={log_lines}", "--lines={log_lines}"]
args = ["{path:string}"]

[rules.action]
type = "tail_file"
path_capture = "path"
lines_capture = "log_lines"
default_lines = 200
root_set = "roots"

[[rules]]
command = "stat"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-c={string}"]
args = ["{path:string}"]

[rules.action]
type = "stat_path"
path_capture = "path"
root_set = "roots"

[[rules]]
command = "ls"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-l", "-a", "-h", "-t", "-r", "-S", "--sort={string}", "-1"]
args = ["{path:string}"]

[rules.action]
type = "list_dir"
path_capture = "path"
root_set = "roots"

[[rules]]
command = "help"
implicit_symlinks = true
arg_style = "gnu_long"

[rules.action]
type = "show_help"

[[rules]]
command = "pct"
implicit_symlinks = true
arg_style = "gnu_long"

[rules.action]
type = "run"
binary = "/usr/sbin/pct"
args = []
timeout = "5000ms"

[[rules.subcommands]]
name = "config"
args = ["{int}"]

[[rules.subcommands]]
name = "list"

[[rules]]
command = "smartctl"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-a"]
args = ["/dev/disk/by-id/{string}"]

[rules.action]
type = "run"
binary = "/usr/sbin/smartctl"
args = []
timeout = "5000ms"

[[rules]]
command = "zpool"
implicit_symlinks = true
arg_style = "gnu_long"

[rules.action]
type = "run"
binary = "/usr/sbin/zpool"
args = []
timeout = "5000ms"

[[rules.subcommands]]
name = "status"
flags = ["-s"]
args = ["{string}"]

[profiles.agent]
users = ["agent"]

[profiles.agent.global]
help_text = "Read-only diagnostics for fleet agent. Run with no arguments to see full list."
