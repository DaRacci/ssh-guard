[global]
audit_log = "/var/log/ssh-guard-audit.log"
audit_format = "logfmt"
help_text = """
Read-only service diagnostics allowed:
  systemctl status|show <unit>
  journalctl -u <unit> [-n <lines>]
  help
"""
log_tag = "ssh-guard"
max_read_bytes = 1048576
max_tail_lines = 5000
default_tail_lines = 200

[contracts.unit]
type = "enum"
values = ["sshd", "nginx", "docker"]

[contracts.lines]
type = "int_range"
min = 1
max = 300

[flag_groups]
pager = ["--no-pager", "--full"]

[[rules]]
command = "systemctl"
implicit_symlinks = true
arg_style = "gnu_long"

[rules.action]
type = "run"
binary = "/usr/bin/systemctl"
args = []
timeout = "10000ms"

[[rules.subcommands]]
name = "status"
flag_groups = ["pager"]
args = ["{unit}.service"]

[[rules.subcommands]]
name = "show"
flag_groups = ["pager"]
flags = ["--property={string}"]
args = ["{unit}.service"]

[[rules]]
command = "journalctl"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["--no-pager", "-q"]

[rules.action]
type = "run"
binary = "/usr/bin/journalctl"
args = []
timeout = "10000ms"

[[rules.subcommands]]
name = "-u"
flag_groups = ["pager"]
flags = [
  "-n={lines}",
  "--lines={lines}",
  "-o={string}",
  "--output={string}",
  "-b",
]
args = ["{unit}.service"]
