roots = [
  "/var/log/nginx",
  "/srv/app/log",
  "/etc/nginx",
]

[root_sets]
app = [
  "/srv/app/releases",
  "/srv/app/current",
]

[global]
audit_log = "/var/log/ssh-guard-audit.log"
audit_format = "json"
help_text = """
Read-only web/log diagnostics allowed:
  ls <path>
  stat <path>
  cat <path>
  tail [-n <lines>] <path>
  grep [-n] <pattern> <path>
  releases <path>
  journalctl -u nginx [-n <lines>]
"""
log_tag = "ssh-guard"
max_read_bytes = 1048576
max_tail_lines = 2000
default_tail_lines = 200

[contracts.lines]
type = "int_range"
min = 1
max = 500

[contracts.log_path]
type = "path"
root_set = "roots"

[contracts.release_path]
type = "path"
root_set = "app"

[[rules]]
command = "ls"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-l", "-a", "-h", "-1", "--sort={string}"]
args = ["{path:log_path}"]

[rules.action]
type = "list_dir"
path_capture = "path"
root_set = "roots"

[[rules]]
command = "stat"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-c={string}"]
args = ["{path:log_path}"]

[rules.action]
type = "stat_path"
path_capture = "path"
root_set = "roots"

[[rules]]
command = "cat"
implicit_symlinks = true
arg_style = "gnu_long"
args = ["{path:log_path}"]

[rules.action]
type = "read_file"
path_capture = "path"
root_set = "roots"

[[rules]]
command = "tail"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-n={lines}", "--lines={lines}"]
args = ["{path:log_path}"]

[rules.action]
type = "tail_file"
path_capture = "path"
lines_capture = "lines"
default_lines = 200
root_set = "roots"

# `grep` is a `run` action, but its path argument is still validated at match time
# through the `log_path` contract before `/usr/bin/grep` is allowed to run.
[[rules]]
command = "grep"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-n", "-i", "-F"]
args = ["{pattern:string}", "{path:log_path}"]

[rules.action]
type = "run"
binary = "/usr/bin/grep"
args = ["--color=never"]
timeout = "10000ms"

# `releases` is scoped to the `app` root set, which is separate from the default
# `roots` set above. Only this set grants access to the release/current trees.
[[rules]]
command = "releases"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["-l", "-a", "-h", "-1", "--sort={string}"]
args = ["{path:release_path}"]

[rules.action]
type = "list_dir"
path_capture = "path"
root_set = "app"

[[rules]]
command = "journalctl"
implicit_symlinks = true
arg_style = "gnu_long"
flags = ["--no-pager", "-q"]

[rules.action]
type = "run"
binary = "/usr/bin/journalctl"
args = []
timeout = "10000ms"

[[rules.subcommands]]
name = "-u"
flags = ["-n={lines}", "--lines={lines}", "--no-pager", "-q"]
args = ["nginx.service"]

[[rules]]
command = "help"
implicit_symlinks = true
arg_style = "gnu_long"

[rules.action]
type = "show_help"

[profiles.deploy]
users = ["deploy"]
roots = ["/srv/app/releases", "/srv/app/current/config"]

[profiles.deploy.global]
help_text = """
Read-only web/log diagnostics for deploy user:
  ls|stat|cat|tail under nginx/app paths
  grep [-n] <pattern> <path>
  releases <path>
  journalctl -u nginx [-n <lines>]
"""
